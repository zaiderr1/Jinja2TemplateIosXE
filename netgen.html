    } else if (!Object.prototype.hasOwnProperty.call(tplFiles(job.os), "main.j2")) {
      const what = custom ? `in ${tplDirName(job.os)}` : `for ${job.os}`;
      problems.push(`${job.host}: no main.j2 ${what} (expected ${tplDirName(job.os)}/main.j2)`);
    }
    if (outputs.has(job.output)) problems.push(`${job.host}: output name '${job.output}' already used by ${outputs.get(job.output)}`);
    outputs.set(job.output, job.host);
  }
  if (problems.length) return stop("Nothing generated. Fix these first:", problems);
  if (!jobs.length) return stop("Nothing to generate:", ["No device has Generate = yes in the Generate sheet."]);

  const lenient = Boolean(custom) && !strict;
  if (lenient) {
    const variants = findVariantLoops(custom.files);
    if (variants.length) {
      res.notes.push(`These loops are variants and stay empty: ${variants.join(", ")}. Excel rows are rendered with the structure of the first loop (e.g. bgp_vrfs, not bgp_vrfs_2). Check the result, or merge the variants in the draft.`);
    }
  }

  for (const job of jobs) {
    const files = tplFiles(job.os);
    const disabled = new Set(Object.entries(job.blocks).filter(([, on]) => !on).map(([b]) => b + ".j2"));
    const loader = (name) => (disabled.has(name) ? "" : Object.prototype.hasOwnProperty.call(files, name) ? files[name] : null);
    const d = data.get(job.host);
    let text, seen, deps;
    try {
      ({ text, seen } = renderTemplate(loader, "main.j2", { blocks: job.blocks, ...d }, lenient));
      if (lenient) text = text.split("\n").filter((l) => !l.includes(SKIP)).join("\n");
      deps = findDependencies(text);
      text = dependencySlot(deps, job.host) + text;
    } catch (e) {
      if (e instanceof UndefinedError) {
        res.failed.push({ host: job.host, lines: [
          `${job.host}: the templates in ${tplDirName(job.os)} use a variable the Excel data doesn't provide: ${e.message}`,
          "  Available: local_as, router_id (if filled), blocks.vrf/interfaces/bgp,",
          "    vrfs[].name/vpn_id, subinterfaces[].name/dot1q/vrf/ip/mask/description,",
          "    bgp_vrfs[].vrf/vpn_id, bgp_vrfs[].neighbors[].ip/remote_as/device_b/description,",
          "    bgp_global[].ip/remote_as/device_b/description, grt_label",
          "  Untick \"Stop on values missing from Excel\" to leave out what the Excel doesn't provide."] });
        continue;
      }
      if (e instanceof TemplateError) {
        res.failed.push({ host: job.host, lines: [`${job.host}: template error in ${tplDirName(job.os)}: ${e.message}`] });
        continue;
      }
      throw e;
    }
    res.configs.push({
      host: job.host, os: job.os, blocks: job.blocks, output: job.output,
      source: custom ? custom.name : job.os, text, data: d, dependencies: deps,
      left_out: lenient ? [...seen].sort() : [],
    });
  }
  const selected = new Set(jobs.map((j) => j.host));
  const skipped = [...data.keys()].filter((h) => !selected.has(h));
  if (skipped.length) res.skipped.push(`Not selected in the Generate sheet: ${skipped.join(", ")}`);
  const noPort = [...incomplete.keys()].filter((h) => !selected.has(h));
  if (noPort.length) res.skipped.push("Port B empty, so the Device B side can't be built: " + noPort.map((h) => `${h} (row ${incomplete.get(h).join(", ")})`).join(", "));
  return finish(res);
}

/* ---------------------------------------------------------------------------
 * 5b. dependencies.py port: what a configuration uses but does not create.
 *     Same rules, same order, same text as dependencies.py.
 * ------------------------------------------------------------------------- */
const DEP_KINDS = [
  ["interface", true, ["interface {n}"]],
  ["vrf", true, ["vrf definition {n}", "ip vrf {n}", "vrf {n}"]],
  ["peer-group", false, ["neighbor {n} peer-group"]],
  ["peer-session", false, ["template peer-session {n}"]],
  ["peer-policy", false, ["template peer-policy {n}"]],
  ["neighbor-group", false, ["neighbor-group {n}"]],
  ["session-group", false, ["session-group {n}"]],
  ["af-group", false, ["af-group {n} .*"]],
  ["route-map", true, ["route-map {n}(?: .*)?"]],
  ["route-policy", true, ["route-policy {n}(?:\\(.*\\))?"]],
  ["prefix-list", true, ["ip prefix-list {n} .*", "prefix-set {n}"]],
  ["access-list", true, ["ip access-list (?:standard |extended )?{n}", "access-list {n} .*", "ipv4 access-list {n}"]],
  ["policy-map", true, ["policy-map (?:type \\S+ )?{n}"]],
];
const DEP_ORDER = DEP_KINDS.map(([k]) => k);
const DEP_MAX_USERS = 3;
const DEP_REFERENCES = [
  ["interface (\\S+)\\.(\\d+)", "interface", 1, "top", "sub"],
  ["(?:ip )?vrf forwarding (\\S+)", "vrf", 1, "sub", null],
  ["neighbor (\\S+) route-map (\\S+) (in|out)", "route-map", 2, "sub", "neighbor"],
  ["neighbor (\\S+) prefix-list (\\S+) (in|out)", "prefix-list", 2, "sub", "neighbor"],
  ["neighbor (\\S+) peer-group (\\S+)", "peer-group", 2, "sub", "neighbor1"],
  ["neighbor (\\S+) inherit peer-session (\\S+)", "peer-session", 2, "sub", "neighbor1"],
  ["neighbor (\\S+) inherit peer-policy (\\S+)", "peer-policy", 2, "sub", "neighbor1"],
  ["neighbor (\\S+) update-source (\\S+)", "interface", 2, "sub", "neighbor1"],
  ["update-source (\\S+)", "interface", 1, "sub", null],
  ["use (neighbor-group|session-group|af-group) (\\S+)", null, 2, "sub", null],
  ["(?:ip |ipv4 )?access-group (\\S+)(?: (?:in|out|ingress|egress))?", "access-list", 1, "sub", null],
  ["access-class (\\S+) .*", "access-list", 1, "sub", null],
  ["service-policy (input|output) (\\S+)", "policy-map", 2, "sub", null],
  ["route-policy (\\S+) (in|out)", "route-policy", 1, "sub", "direction"],
  ["(.*?)\\broute-policy (\\S+?)(?:\\(.*\\))?(?: .*)?", "route-policy", 2, "sub", "before"],
  ["(.*?)\\broute-map (\\S+)(?: .*)?", "route-map", 2, "sub", "before"],
  ["(.*?)\\bprefix-list (\\S+)(?: .*)?", "prefix-list", 2, "sub", "before"],
  ["vrf (\\S+)", "vrf", 1, "sub", null],
  ["address-family ipv4 vrf (\\S+)", "vrf", 1, "sub", null],
].map(([p, k, g, where, user]) => [new RegExp("^" + p + "$", "i"), k, g, where, user]);
const DEP_NEIGHBOR = /^neighbor (\S+)$/i;
const DEP_VRF_CONTEXT = /^(?:vrf|address-family ipv4 vrf) (\S+)$/i;

function depLines(text) {
  const out = [];
  for (const raw of text.split(/\r\n|\r|\n/)) {
    const s = raw.trim();
    if (!s || s.startsWith("!") || s.toLowerCase().startsWith("description ")) continue;
    out.push([raw.length - raw.replace(/^ +/, "").length, s]);
  }
  return out;
}

function depIsDefined(kind, name, text) {
  const [, top, patterns] = DEP_KINDS.find(([k]) => k === kind);
  const n = name.replace(/[.*+?^${}()|[\]\\\/-]/g, "\\$&");
  const rx = new RegExp("^(?:" + patterns.map((p) => p.split("{n}").join(n)).join("|") + ")\\s*$", "i");
  return depLines(text).some(([indent, s]) => (!top || indent === 0) && rx.test(s));
}

function depUser(m, user, stack, line) {
  let vrf = null, neighbor = null;
  for (let i = stack.length - 1; i >= 0; i--) {
    const v = DEP_VRF_CONTEXT.exec(stack[i][1]);
    if (v && vrf === null) vrf = v[1];
    const nb = DEP_NEIGHBOR.exec(stack[i][1]);
    if (nb && neighbor === null) neighbor = nb[1];
  }
  const section = stack.length ? stack[0][1] : line;
  let text;
  if (user === "sub") return "sub-interface ." + m[2];
  if (user === "neighbor") text = `neighbor ${m[1]} ${m[3]}`;
  else if (user === "neighbor1") text = `neighbor ${m[1]}`;
  else if (user === "direction") text = (neighbor ? `neighbor ${neighbor} ` : "") + m[2];
  else if (user === "before") {
    const low = section.toLowerCase();
    if (low.startsWith("route-map ") || low.startsWith("route-policy ")) text = section;
    else text = (neighbor ? `neighbor ${neighbor} ` : "") + (m[1].trim() || section);
  } else text = neighbor ? `neighbor ${neighbor}` : section;
  if (vrf && text !== section && !text.split(/\s+/).includes("vrf")) text += ` (vrf ${vrf})`;
  return text;
}

function findDependencies(text) {
  const found = new Map();
  const stack = [];
  for (const [indent, s] of depLines(text)) {
    while (stack.length && stack[stack.length - 1][0] >= indent) stack.pop();
    for (const [rx, kind, group, where, user] of DEP_REFERENCES) {
      if ((where === "top") !== (indent === 0)) continue;
      const m = rx.exec(s);
      if (!m) continue;
      const k = kind || m[1].toLowerCase();
      const name = m[group];
      const used = depUser(m, user, stack, s);
      const key = k + "\u0000" + name;
      if (!found.has(key)) found.set(key, { kind: k, name, used_by: [] });
      const dep = found.get(key);
      if (!dep.used_by.includes(used)) dep.used_by.push(used);
      break;
    }
    stack.push([indent, s]);
  }
  const deps = [...found.values()].filter((d) => !depIsDefined(d.kind, d.name, text));
  deps.sort((a, b) => DEP_ORDER.indexOf(a.kind) - DEP_ORDER.indexOf(b.kind));
  return deps;
}

function depUsersText(dep) {
  const users = dep.used_by;
  let shown;
  if (users.length > 1 && users.every((u) => u.startsWith("sub-interface ."))) {
    shown = "sub-interfaces " + users.slice(0, DEP_MAX_USERS).map((u) => u.slice("sub-interface ".length)).join(", ");
  } else shown = users.slice(0, DEP_MAX_USERS).join(", ");
  if (users.length > DEP_MAX_USERS) shown += ` +${users.length - DEP_MAX_USERS} more`;
  return shown;
}

function dependencySlot(deps, host) {
  const rule = "! " + "-".repeat(75);
  if (!deps.length) return `${rule}\n! DEPENDENCIES of ${host}: none - everything this configuration uses is in it.\n${rule}\n!\n`;
  const width = Math.min(55, Math.max(...deps.map((d) => d.kind.length + 1 + d.name.length)));
  const lines = [rule, `! DEPENDENCIES of ${host}: NOT generated here, must already exist on the device`, "! (check them before the change)"];
  for (const d of deps) lines.push(`!   ${(d.kind + " " + d.name).padEnd(width)}  <- ${depUsersText(d)}`);
  lines.push(rule, "!");
  return lines.join("\n") + "\n";
}

function finish(res) {
  res.ok = !res.errors.length && !res.failed.length;
  return res;
}

/* ---------------------------------------------------------------------------
 * 6. dns_names.py port
 * ------------------------------------------------------------------------- */
const DEFAULT_ABBREVIATIONS = [
  ["TenGigabitEthernet", "Te"], ["TenGigE", "Te"],
  ["TwentyFiveGigabitEthernet", "Twe"], ["TwentyFiveGigE", "Twe"],
  ["FortyGigabitEthernet", "Fo"], ["FortyGigE", "Fo"],
  ["HundredGigabitEthernet", "Hu"], ["HundredGigE", "Hu"],
  ["GigabitEthernet", "Gi"], ["FastEthernet", "Fa"],
  ["Ethernet", "Et"], ["Loopback", "Lo"], ["Vlan", "Vl"],
  ["Tunnel", "Tu"], ["Port-channel", "Po"], ["Bundle-Ether", "BE"],
  ["MgmtEth", "Mg"],
];
const STATUS = {
  OK: "OK", SHUTDOWN: "shutdown", SECONDARY: "secondary", DUP_NAME: "duplicate name",
  DUP_IP: "duplicate IP", TOO_LONG: "name too long", DOT1Q: "dot1q \u2260 sub-interface number",
  UNKNOWN_TYPE: "unknown interface type",
};
const NOT_A_RECORD = "(not a record)";
const TABLE_COLUMNS = ["FQDN", "IPv4 address", "Device", "Interface", "dot1q", "VRF", "Status"];

function decodeText(bytes) {
  // read_text_file(): UTF-8 (with or without BOM), else Windows cp1252
  try {
    let s = new TextDecoder("utf-8", { fatal: true }).decode(bytes);
    if (s.charCodeAt(0) === 0xfeff) s = s.slice(1);
    return s;
  } catch (e) {
    return new TextDecoder("windows-1252").decode(bytes);
  }
}

const PY_WS = /^[\s\u001c-\u001f\u0085]+|[\s\u001c-\u001f\u0085]+$/g;
const pyStrip = (s) => s.replace(PY_WS, "");

function parseConfig(text, source = "") {
  // parse_config(): only hostname, interfaces, addresses, VRF, dot1q, shutdown are kept
  const result = { source, hostname: null, platform: "unknown", interfaces: [], problems: [] };
  let current = null, bannerEnd = null, xr = false;
  const lines = text.split(/\r\n|[\n\r\v\f\u001c\u001d\u001e\u0085\u2028\u2029]/);
  if (lines.length && lines[lines.length - 1] === "") lines.pop();
  lines.forEach((line, idx) => {
    const number = idx + 1;
    if (bannerEnd !== null) { if (line.includes(bannerEnd)) bannerEnd = null; return; }
    const stripped = pyStrip(line);
    if (!stripped || stripped.startsWith("!")) return;
    const banner = /^banner\s+\S+\s+([\s\S]+)/i.exec(stripped);
    if (banner) {
      const payload = banner[1];
      const delimiter = payload.startsWith("^C") ? "^C" : payload[0];
      if (!payload.slice(delimiter.length).includes(delimiter)) bannerEnd = delimiter;
      current = null;
      return;
    }
    if (!/\s/.test(line[0])) {
      current = null;
      const host = /^hostname\s+(\S+)$/i.exec(stripped);
      if (host && result.hostname === null) result.hostname = host[1];
      const intf = /^interface\s+(\S+)$/i.exec(stripped);
      if (intf) {
        current = { name: intf[1], addresses: [], shutdown: false, vrf: "", dot1q: null, line_no: number };
        result.interfaces.push(current);
        xr = xr || /\d+\/\d+\/\d+\/\d+/.test(current.name);
      }
      return;
    }
    if (current === null) return;
    if (/^ipv4\s+address\b/i.test(stripped)) xr = true;
    const low = stripped.toLowerCase();
    if (low === "shutdown" || low === "no shutdown") current.shutdown = low === "shutdown";
    const vrf = /^vrf\s+(?:forwarding\s+)?(\S+)$/i.exec(stripped);
    if (vrf) current.vrf = vrf[1];
    const encap = /^encapsulation\s+dot1q\s+(\d+)\b/i.exec(stripped);
    if (encap) current.dot1q = encap[1];
    const address = /^(ip|ipv4)\s+address\s+(\S+)(?:\s+(\S+))?(?:\s+(secondary))?$/i.exec(stripped);
    if (!address) return;
    const [, family, value, mask, secondary] = address;
    try {
      let parsed, isSecondary;
      if (value.includes("/") && family.toLowerCase() === "ipv4") {
        if (mask && mask.toLowerCase() !== "secondary") return;
        parsed = ipv4Interface(value);
        isSecondary = Boolean(secondary || mask);
      } else {
        if (!mask) return;
        parsed = ipv4Interface(value + "/" + mask);
        isSecondary = Boolean(secondary);
      }
      current.addresses.push({ ip: parsed.ip, prefix_len: parsed.prefix, secondary: isSecondary });
    } catch (e) { /* invalid address: ignored */ }
  });
  result.platform = xr ? "IOS-XR" : result.interfaces.length ? "IOS-XE" : "unknown";
  if (result.hostname === null) result.problems.push("no hostname line");
  return result;
}

function shortInterfaceName(name, abbreviations) {
  // short_interface_name() -> [short, sub-interface number, known type]
  const sub = /\.(\d+)$/.exec(name);
  let base = sub ? name.slice(0, sub.index) : name;
  const token = /^[A-Za-z]+(?:-[A-Za-z]+)*/.exec(base);
  const kind = token ? token[0] : "";
  let known = false;
  const byLong = [...abbreviations].sort((a, b) => b[0].length - a[0].length);
  for (const [longName, shortName] of byLong) {
    if (kind.toLowerCase() === longName.toLowerCase()) { base = shortName + base.slice(kind.length); known = true; break; }
  }
  if (!known) {
    const byShort = [...abbreviations].sort((a, b) => b[1].length - a[1].length);
    for (const [, shortName] of byShort) {
      if (kind.toLowerCase() === shortName.toLowerCase()) { base = shortName + base.slice(kind.length); known = true; break; }
    }
  }
  return [base.replace(/[^A-Za-z0-9-]/g, "-"), sub ? sub[1] : "", known];
}

function markDuplicates(records) {
  const names = new Map(), ips = new Map();
  for (const r of records) {
    if (r.is_record && r.fqdn) { const k = r.fqdn.toLowerCase(); if (!names.has(k)) names.set(k, []); names.get(k).push(r); }
    if (r.ip) { if (!ips.has(r.ip)) ips.set(r.ip, []); ips.get(r.ip).push(r); }
  }
  for (const [groups, warning] of [[names, STATUS.DUP_NAME], [ips, STATUS.DUP_IP]]) {
    for (const group of groups.values()) {
      if (group.length > 1) for (const r of group) if (!r.warnings.includes(warning)) r.warnings.push(warning);
    }
  }
}

function defaultDnsSettings() {
  return { domain: "example.intra", include_secondary: false, exclude_shutdown: false, lowercase: false,
           abbreviations: DEFAULT_ABBREVIATIONS.map((p) => p.slice()) };
}

function buildRecords(files, settings) {
  settings = settings || defaultDnsSettings();
  const result = { records: [], files: [...files], problems: [] };
  for (const loaded of result.files) {
    for (const p of loaded.problems) result.problems.push((loaded.source ? loaded.source + ": " : "") + p);
    if (!loaded.hostname) { if (!loaded.problems.length) result.problems.push("no hostname line"); continue; }
    for (const intf of loaded.interfaces) {
      if (intf.shutdown && settings.exclude_shutdown) continue;
      const [short, sub, known] = shortInterfaceName(intf.name, settings.abbreviations);
      const dot1q = sub ? (intf.dot1q || sub) : "";
      const label = loaded.hostname + "_" + short + (dot1q ? "_" + dot1q : "");
      let secondaryNumber = 0;
      for (const address of intf.addresses) {
        const warnings = [];
        if (intf.shutdown) warnings.push(STATUS.SHUTDOWN);
        if (address.secondary) { secondaryNumber++; warnings.push(STATUS.SECONDARY); }
        if (!known) warnings.push(STATUS.UNKNOWN_TYPE);
        if (sub && intf.dot1q && parseInt(sub, 10) !== parseInt(intf.dot1q, 10)) warnings.push(STATUS.DOT1Q);
        const isRecord = !address.secondary || settings.include_secondary;
        const suffix = address.secondary ? "-sec" + secondaryNumber : "";
        let fqdn = isRecord ? label + suffix + "." + settings.domain : "";
        if (settings.lowercase) fqdn = fqdn.toLowerCase();
        if (fqdn.split(".").some((part) => part.length > 63)) warnings.push(STATUS.TOO_LONG);
        result.records.push({ fqdn, ip: address.ip, device: loaded.hostname, interface: intf.name, dot1q,
                              vrf: intf.vrf, warnings, is_record: isRecord, source: loaded.source });
      }
    }
  }
  markDuplicates(result.records);
  return result;
}

const recordStatus = (r) => (r.warnings.length ? r.warnings.join("; ") : STATUS.OK);
const recordRow = (r) => [r.fqdn || NOT_A_RECORD, r.ip, r.device, r.interface, r.dot1q, r.vrf, recordStatus(r)];

function summaryText(result) {
  const devices = new Set(result.files.filter((f) => f.hostname).map((f) => f.hostname));
  return `${result.records.filter((r) => r.is_record).length} records from ${devices.size} devices, ${result.records.filter((r) => r.warnings.length).length} warnings`;
}

function tableSortKey(columnIndex, value) {
  // table_sort_key(): IPs and dot1q sort as numbers
  if (columnIndex === 1 || columnIndex === 4) {
    if (columnIndex === 1) { const n = parseV4(value); return n === null ? [1, 0] : [0, Number(n)]; }
    return /^\s*[+-]?\d+\s*$/.test(value) ? [0, parseInt(value, 10)] : [1, 0];
  }
  return [0, value.toLowerCase()];
}

function compareKeys(a, b) {
  for (let i = 0; i < a.length; i++) { if (a[i] < b[i]) return -1; if (a[i] > b[i]) return 1; }
  return 0;
}

function csvField(v) {
  return /[",\r\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
}

function toCsv(records) {
  // to_csv_bytes() without the BOM (added when saving)
  const rows = [TABLE_COLUMNS, ...records.map(recordRow)];
  return rows.map((row) => row.map(csvField).join(",") + "\r\n").join("");
}

const singleLine = (v) => v.replace(/[\t\r\n]/g, " ");

function toTsv(records, header = true) {
  const rows = header ? [TABLE_COLUMNS] : [];
  rows.push(...records.map(recordRow));
  return rows.map((row) => row.map(singleLine).join("\t") + "\n").join("");
}

function psQuote(value) {
  value = value.replace(/`/g, "``").replace(/\$/g, "`$").replace(/"/g, '`"');
  return '"' + value.replace(/\r/g, "`r").replace(/\n/g, "`n") + '"';
}

function toPowershell(records, domain) {
  const lines = [];
  for (const r of records) {
    if (!r.is_record) continue;
    const suffix = "." + domain;
    const name = r.fqdn.toLowerCase().endsWith(suffix.toLowerCase()) ? r.fqdn.slice(0, -suffix.length) : r.fqdn;
    let line = `Add-DnsServerResourceRecordA -ZoneName ${psQuote(domain)} -Name ${psQuote(name)} -IPv4Address ${psQuote(r.ip)} -CreatePtr`;
    if (r.warnings.length) line = "# " + line + "  # " + singleLine(recordStatus(r));
    lines.push(line);
  }
  return lines.map((l) => l + "\r\n").join("");
}

/* ---------------------------------------------------------------------------
 * 7. ZIP writer (Save all as one .zip when the browser can't write a folder)
 * ------------------------------------------------------------------------- */
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
  return t;
})();
function crc32(bytes) { let c = 0xffffffff; for (const b of bytes) c = CRC_TABLE[(c ^ b) & 0xff] ^ (c >>> 8); return (c ^ 0xffffffff) >>> 0; }

function makeZip(files) {
  // files: [{name, bytes}] -> Uint8Array (stored, no compression)
  const enc = new TextEncoder(), parts = [], central = [];
  let offset = 0;
  const now = new Date();
  const dosTime = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1);
  const dosDate = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
  for (const f of files) {
    const name = enc.encode(f.name), crc = crc32(f.bytes), size = f.bytes.length;
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true);
    lh.setUint16(10, dosTime, true); lh.setUint16(12, dosDate, true); lh.setUint32(14, crc, true);
    lh.setUint32(18, size, true); lh.setUint32(22, size, true); lh.setUint16(26, name.length, true);
    parts.push(new Uint8Array(lh.buffer), name, f.bytes);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);
    ch.setUint16(12, dosTime, true); ch.setUint16(14, dosDate, true); ch.setUint32(16, crc, true);
    ch.setUint32(20, size, true); ch.setUint32(24, size, true); ch.setUint16(28, name.length, true); ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), name);
    offset += 30 + name.length + size;
  }
  const cdSize = central.reduce((s, p) => s + p.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
  const all = [...parts, ...central, new Uint8Array(end.buffer)];
  const out = new Uint8Array(all.reduce((s, p) => s + p.length, 0));
  let o = 0;
  for (const p of all) { out.set(p, o); o += p.length; }
  return out;
}

if (typeof module !== "undefined") {
  module.exports = { readWorkbook, generateConfigs, renderTemplate, parseConfig, buildRecords, shortInterfaceName,
    defaultDnsSettings, summaryText, recordRow, toCsv, toTsv, toPowershell, tableSortKey, compareKeys, decodeText,
    ipNetwork, ipAddress, makeZip, unzip, pyFloatStr, PyFloat, norm, cellText, STATUS, TABLE_COLUMNS };
}
/* ENGINE END ================================================================ */

const $ = (id) => document.getElementById(id);

}
$("tab-btn-gen").onclick = () => showTab("gen");
$("tab-btn-dns").onclick = () => showTab("dns");
showTab(prefs.tab === "dns" ? "dns" : "gen");

/* Saving files (only on explicit clicks) ------------------------------------------ */
async function saveFile(name, bytes, mime, ext) {
  // Native save dialog when the browser has one, otherwise a normal download.
  if (window.showSaveFilePicker) {
    let handle;
    try {
      handle = await window.showSaveFilePicker({ suggestedName: name, types: [{ description: ext, accept: { [mime]: ["." + ext] } }] });
    } catch (e) { if (e.name === "AbortError") return false; handle = null; }
    if (handle) {
      const w = await handle.createWritable();
      await w.write(bytes);
      await w.close();
      return handle.name;
    }
  }
  const url = URL.createObjectURL(new Blob([bytes], { type: mime }));
  const a = el("a", { href: url, download: name });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  return name;
}

function confirmList(text, items) {
  return new Promise((resolve) => {
    const d = $("confirm");
    $("confirm-text").textContent = text;
    $("confirm-list").textContent = items.join("\n");
    $("confirm-yes").onclick = () => { d.close(); resolve(true); };
    $("confirm-no").onclick = () => { d.close(); resolve(false); };
    d.oncancel = () => resolve(false);
    d.showModal();
  });
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch (e) {
    const ta = el("textarea", { style: "position:fixed;left:-9999px" });
    ta.value = text; document.body.append(ta); ta.select();
    const ok = document.execCommand("copy"); ta.remove(); return ok;
  }
}

function busy(btn, on) { btn.classList.toggle("busy", on); btn.disabled = on; }
const nextFrame = () => new Promise((r) => setTimeout(r, 0));
const utf8 = (s) => new TextEncoder().encode(s);
const withBom = (s) => { const b = utf8(s); const out = new Uint8Array(b.length + 3); out.set([0xef, 0xbb, 0xbf]); out.set(b, 3); return out; };

/* =============================================================================
 * Tab 1 — Config generator
 * ========================================================================== */
const STD = JSON.parse($("std-templates").textContent);
const gen = { xlsxHandle: null, xlsxFile: null, xlsxName: "", tplHandle: null, tplFiles: null, tplName: "", res: null, selected: null };

function setPath(id, text) { const p = $(id); p.textContent = text || ""; p.classList.toggle("empty", !text); p.title = text || ""; }
setPath("xlsx-path", ""); $("xlsx-path").textContent = TEXT.noExcel;
setPath("tpl-path", ""); $("tpl-path").textContent = TEXT.stdTemplates;

function setExcel(handle, file) {
  gen.xlsxHandle = handle; gen.xlsxFile = file;
  gen.xlsxName = (handle || file).name;
  setPath("xlsx-path", gen.xlsxName);
  $("gen-run").disabled = false;
}

$("xlsx-browse").onclick = async () => {
  if (window.showOpenFilePicker) {
    try {
      const [h] = await window.showOpenFilePicker({ types: [{ description: "Excel", accept: { "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet": [".xlsx", ".xlsm"] } }] });
      setExcel(h, null); runGenerate(); return;
    } catch (e) { if (e.name === "AbortError") return; }
  }
  $("xlsx-input").click();
};
$("xlsx-input").onchange = (e) => { const f = e.target.files[0]; if (f) { setExcel(null, f); runGenerate(); } e.target.value = ""; };

function dropZone(zone, onItems) {
  zone.addEventListener("dragover", (e) => { e.preventDefault(); zone.classList.add("over"); });
  zone.addEventListener("dragleave", () => zone.classList.remove("over"));
  zone.addEventListener("drop", async (e) => {
    e.preventDefault(); zone.classList.remove("over");
    const items = [...e.dataTransfer.items].filter((i) => i.kind === "file");
    const handles = [];
    for (const it of items) {
      const h = it.getAsFileSystemHandle ? await it.getAsFileSystemHandle().catch(() => null) : null;
      handles.push({ handle: h, file: it.getAsFile() });
    }
    onItems(handles);
  });
}
dropZone($("xlsx-drop"), (items) => {
  const it = items.find((i) => /\.xls[xm]$/i.test((i.file || i.handle || {}).name || ""));
  if (it) { setExcel(it.handle && it.handle.kind === "file" ? it.handle : null, it.file); runGenerate(); }
});

async function readExcelBytes() {
  if (gen.xlsxHandle) return new Uint8Array(await (await gen.xlsxHandle.getFile()).arrayBuffer()); // fresh from disk
  try { return new Uint8Array(await gen.xlsxFile.arrayBuffer()); }
  catch (e) { throw new Error(TEXT.reread); }
}

/* Template folder */
async function readTemplateDir() {
  if (gen.tplHandle) {
    const files = {};
    for await (const [name, h] of gen.tplHandle.entries()) if (h.kind === "file" && name.endsWith(".j2")) files[name] = await (await h.getFile()).text();
    return files;
  }
  return gen.tplFiles;
}
function setTemplates(name, n) {
  setPath("tpl-path", TEXT.tplLoaded(name, n));
  $("tpl-clear").disabled = false;
  $("strict").disabled = false; $("strict-wrap").classList.remove("disabled");
}
$("tpl-browse").onclick = async () => {
  if (window.showDirectoryPicker) {
    try {
      const h = await window.showDirectoryPicker();
      gen.tplHandle = h; gen.tplFiles = null; gen.tplName = h.name;
      const files = await readTemplateDir();
      if (!Object.keys(files).length) { status(TEXT.noJ2); gen.tplHandle = null; return; }
      setTemplates(h.name, Object.keys(files).length);
      if (gen.res) runGenerate();
      return;
    } catch (e) { if (e.name === "AbortError") return; }
  }
  $("tpl-input").click();
};
$("tpl-input").onchange = async (e) => {
  const files = {};
  let folder = "";
  for (const f of e.target.files) {
    const parts = (f.webkitRelativePath || f.name).split("/");
    folder = parts[0];
    if (parts.length === 2 && f.name.endsWith(".j2")) files[f.name] = await f.text();
  }
  e.target.value = "";
  if (!Object.keys(files).length) { status(TEXT.noJ2); return; }
  gen.tplHandle = null; gen.tplFiles = files; gen.tplName = folder;
  setTemplates(folder, Object.keys(files).length);
  if (gen.res) runGenerate();
};
$("tpl-clear").onclick = () => {
  gen.tplHandle = null; gen.tplFiles = null; gen.tplName = "";
  setPath("tpl-path", ""); $("tpl-path").textContent = TEXT.stdTemplates;
  $("tpl-clear").disabled = true;
  $("strict").checked = false; $("strict").disabled = true; $("strict-wrap").classList.add("disabled");
  if (gen.res) runGenerate();
};
$("strict").onchange = () => { if (gen.res) runGenerate(); };

$("gen-run").onclick = () => runGenerate();
document.addEventListener("keydown", (e) => {
  if (e.ctrlKey && e.key === "Enter") {
    e.preventDefault();
    if ($("tab-gen").classList.contains("active")) { if (!$("gen-run").disabled) runGenerate(); }
    else runDns();
  }
});

async function runGenerate() {
  if (!gen.xlsxHandle && !gen.xlsxFile) return;
  const btn = $("gen-run");
  busy(btn, true);
  await nextFrame();
  try {
    const bytes = await readExcelBytes();
    const wb = await readWorkbook(bytes);
    const custom = gen.tplHandle || gen.tplFiles ? { name: gen.tplName, files: await readTemplateDir() } : null;
    gen.res = generateConfigs(wb, STD, custom, custom ? $("strict").checked : false);
    const still = gen.res.configs.find((c) => c.host === gen.selected) || gen.res.failed.find((f) => f.host === gen.selected);
    if (!still) gen.selected = (gen.res.configs[0] || gen.res.failed[0] || {}).host || null;
    renderGen();
  } catch (e) {
    gen.res = null;
    renderGenError(e.message === TEXT.reread ? e.message : TEXT.readError(e.message));
  } finally { busy(btn, false); }
}

function renderGenError(msg) {
  const w = $("gen-work");
  w.replaceChildren(el("div", { class: "msg bad" }, el("h3", { text: msg })));
}

function cfgView(text, failed) {
  const pre = el("pre", { class: "cfg" + (failed ? " failed" : ""), tabindex: "0" });
  for (const line of text.replace(/\n$/, "").split("\n")) {
    const span = el("span");
    if (!failed && /^\s*!\s*$/.test(line)) { span.className = "bang"; span.textContent = line; }
    else if (!failed && /^\S/.test(line)) {
      const m = /^(\S+)(.*)$/.exec(line);
      span.append(el("span", { class: "kw", style: "display:inline;padding:0" }, m[1]), m[2]);
    } else span.textContent = line;
    pre.append(span);
  }
  return pre;
}

function renderGen() {
  const r = gen.res, w = $("gen-work");
  if (r.errors.length) {
    w.replaceChildren(el("div", { class: "msg bad", role: "alert" }, el("h3", { text: r.error_title }), el("ul", {}, r.errors.map((e) => el("li", { text: e })))));
    status(r.error_title);
    return;
  }
  const kids = [el("div", { class: "summary", text: TEXT.nGenerated(r.configs.length) })];
  if (r.notes.length) kids.push(el("div", { class: "msg warn" }, el("ul", {}, r.notes.map((n) => el("li", { text: n })))));

  // device list: generated (green / amber), failed (red), not generated (grey)
  const list = el("div", { class: "devices", role: "listbox" });
  const item = (host, cls, sub, onclick) => el("button", { class: "dev", role: "option", "aria-selected": String(gen.selected === host), onclick },
    el("span", { class: "dot " + cls }), el("span", { class: "name", text: host }), sub ? el("span", { class: "os", text: sub }) : null);
  for (const c of r.configs) list.append(item(c.host, c.left_out.length ? "warn" : "ok", c.os, () => { gen.selected = c.host; renderGen(); }));
  for (const f of r.failed) list.append(item(f.host, "bad", TEXT.failed, () => { gen.selected = f.host; renderGen(); }));
  for (const s of r.skipped) { list.append(el("div", { class: "dev", style: "cursor:default" }, el("span", { class: "dot off" }), el("span", { class: "name", text: TEXT.notGenerated }))); list.append(el("div", { class: "dev-note", text: s })); }

  // console
  const c = r.configs.find((x) => x.host === gen.selected);
  const f = r.failed.find((x) => x.host === gen.selected);
  const con = el("div", { class: "console" });
  if (c) {
    const blocks = Object.entries(c.blocks).filter(([, on]) => on).map(([b]) => b).join(", ");
    con.append(el("div", { class: "console-bar" },
      el("span", { class: "prompt" }, el("b", { text: c.host + "#" }), " " + c.output + ".cfg"),
      el("span", { class: "meta", text: `${c.source}  |  ${blocks}` }),
      el("span", { class: "actions" },
        el("button", { class: "btn small", onclick: async () => { if (await copyText(c.text)) status(TEXT.copied(c.output + ".cfg")); } }, TEXT.copy),
        el("button", { class: "btn small", onclick: async () => { const n = await saveFile(c.output + ".cfg", utf8(c.text), "text/plain", "cfg"); status(n ? TEXT.saved(n) : TEXT.cancelled); } }, TEXT.saveCfg),
        el("button", { class: "btn small", onclick: saveAll }, TEXT.saveAll))));
    if (c.left_out.length) con.append(el("div", { class: "leftout", text: TEXT.leftOut + c.left_out.join(", ") }));
    con.append(cfgView(c.text, false));
  } else if (f) {
    con.append(el("div", { class: "console-bar" }, el("span", { class: "prompt" }, el("b", { text: f.host + "#" }), " " + TEXT.failed)));
    con.append(cfgView(f.lines.join("\n"), true));
  }
  kids.push(el("div", { class: "split" }, list, con));
  w.replaceChildren(...kids);
  status(TEXT.nGenerated(r.configs.length));
}

async function saveAll() {
  const cfgs = gen.res.configs;
  if (window.showDirectoryPicker) {
    let dir;
    try { dir = await window.showDirectoryPicker({ mode: "readwrite" }); }
    catch (e) { if (e.name === "AbortError") return; dir = null; }
    if (dir) {
      const exists = [];
      for (const c of cfgs) { try { await dir.getFileHandle(c.output + ".cfg"); exists.push(c.output + ".cfg"); } catch (e) { /* new file */ } }
      if (exists.length && !(await confirmList(TEXT.existTitle, exists))) { status(TEXT.cancelled); return; }
      for (const c of cfgs) {
        const w = await (await dir.getFileHandle(c.output + ".cfg", { create: true })).createWritable();
        await w.write(utf8(c.text)); await w.close();
      }
      status(TEXT.savedAll(cfgs.length, "in " + dir.name));
      return;
    }
  }
  const zip = makeZip(cfgs.map((c) => ({ name: c.output + ".cfg", bytes: utf8(c.text) })));
  const n = await saveFile("configs.zip", zip, "application/zip", "zip");
  status(n ? TEXT.savedAll(cfgs.length, "in " + n) : TEXT.cancelled);
}

/* =============================================================================
 * Tab 2 — DNS names
 * ========================================================================== */
const dns = { files: [], result: null, sort: { col: null, dir: 1 } };
const dnsSettings = Object.assign(defaultDnsSettings(), prefs.dns || {});

function persistDns() { prefs.dns = dnsSettings; savePrefs(prefs); }
$("dns-domain").value = dnsSettings.domain;
$("opt-secondary").checked = dnsSettings.include_secondary;
$("opt-shutdown").checked = dnsSettings.exclude_shutdown;
$("opt-lower").checked = dnsSettings.lowercase;
$("dns-domain").oninput = (e) => { dnsSettings.domain = e.target.value.trim(); persistDns(); };
$("opt-secondary").onchange = (e) => { dnsSettings.include_secondary = e.target.checked; persistDns(); if (dns.result) runDns(); };
$("opt-shutdown").onchange = (e) => { dnsSettings.exclude_shutdown = e.target.checked; persistDns(); if (dns.result) runDns(); };
$("opt-lower").onchange = (e) => { dnsSettings.lowercase = e.target.checked; persistDns(); if (dns.result) runDns(); };

function renderAbbr() {
  const body = $("abbr-rows");
  body.replaceChildren(el("tr", {}, el("td", { class: "lbl", text: TEXT.abbrType }), el("td", { class: "lbl", text: TEXT.abbrShort }), el("td")));
  dnsSettings.abbreviations.forEach((pair, i) => {
    const inp = (j) => el("input", { type: "text", value: pair[j], spellcheck: "false", oninput: (e) => { pair[j] = e.target.value.trim(); persistDns(); } });
    body.append(el("tr", {}, el("td", {}, inp(0)), el("td", { style: "width:90px" }, inp(1)),
      el("td", {}, el("button", { class: "x", title: "Remove", onclick: () => { dnsSettings.abbreviations.splice(i, 1); persistDns(); renderAbbr(); } }, "×"))));
  });
}
$("abbr-add").onclick = () => { dnsSettings.abbreviations.push(["", ""]); persistDns(); renderAbbr(); };
$("abbr-reset").onclick = () => { dnsSettings.abbreviations = defaultDnsSettings().abbreviations; persistDns(); renderAbbr(); };
renderAbbr();

async function addConfigFiles(fileList) {
  // find_text_files(): skip files over 5 MB and binary files (NUL bytes). Only parsed fields are kept.
  const skipped = [];
  for (const f of fileList) {
    if (f.size > 5 * 1024 * 1024) { skipped.push(TEXT.skippedBig(f.name)); continue; }
    const bytes = new Uint8Array(await f.arrayBuffer());
    if (bytes.includes(0)) { skipped.push(TEXT.skippedBig(f.name)); continue; }
    dns.files.push(parseConfig(decodeText(bytes), f.name));
  }
  dns.files.sort((a, b) => a.source.toLowerCase().localeCompare(b.source.toLowerCase()));
  renderFiles();
  if (skipped.length) status(skipped.join("; "));
}
function renderFiles() {
  const ul = $("dns-files");
  ul.replaceChildren(...dns.files.map((f, i) => el("li", {},
    el("span", { class: "host", text: f.hostname || "?" }),
    el("span", { class: "fn", text: f.source, title: f.source }),
    el("span", { class: "badge" + (f.platform === "IOS-XR" ? " xr" : "") + (!f.hostname ? " bad" : ""), text: f.hostname ? f.platform : "no hostname" }),
    el("button", { class: "x", title: "Remove", onclick: () => { dns.files.splice(i, 1); renderFiles(); } }, "×"))));
  $("dns-clear").disabled = !dns.files.length;
}
$("dns-add-files").onclick = () => $("dns-files-input").click();
$("dns-files-input").onchange = async (e) => { await addConfigFiles([...e.target.files]); e.target.value = ""; };
$("dns-add-folder").onclick = async () => {
  if (window.showDirectoryPicker) {
    try {
      const h = await window.showDirectoryPicker();
      const files = [];
      for await (const [, x] of h.entries()) if (x.kind === "file") files.push(await x.getFile());
      await addConfigFiles(files);
      return;
    } catch (e) { if (e.name === "AbortError") return; }
  }
  $("dns-folder-input").click();
};
$("dns-folder-input").onchange = async (e) => {
  await addConfigFiles([...e.target.files].filter((f) => (f.webkitRelativePath || f.name).split("/").length === 2));
  e.target.value = "";
};
$("dns-clear").onclick = () => { dns.files = []; renderFiles(); };
dropZone($("dns-drop"), async (items) => {
  const files = [];
  for (const it of items) {
    if (it.handle && it.handle.kind === "directory") { for await (const [, x] of it.handle.entries()) if (x.kind === "file") files.push(await x.getFile()); }
    else if (it.file) files.push(it.file);
  }
  await addConfigFiles(files);
});
$("dns-run").onclick = () => runDns();

function runDns() {
  const sources = [...dns.files];
  const pasted = $("dns-paste").value;
  if (pasted.trim()) sources.push(parseConfig(pasted, TEXT.pasted));
  if (!sources.length) { status(TEXT.noSource); return; }
  dns.result = buildRecords(sources, dnsSettings);
  renderDns();
}

function sortedRecords() {
  const recs = [...dns.result.records];
  const { col, dir } = dns.sort;
  if (col === null) return recs;
  return recs.sort((a, b) => dir * compareKeys(tableSortKey(col, recordRow(a)[col]), tableSortKey(col, recordRow(b)[col])));
}

function renderDns() {
  const r = dns.result, w = $("dns-work");
  const kids = [el("div", { class: "row" },
    el("span", { class: "summary", text: summaryText(r) }),
    el("span", { style: "margin-left:auto", class: "row" },
      el("button", { class: "btn", onclick: async () => { const n = await saveFile("dns_records.csv", withBom(toCsv(sortedRecords())), "text/csv", "csv"); status(n ? TEXT.saved(n) : TEXT.cancelled); } }, TEXT.exportCsv),
      el("button", { class: "btn", onclick: async () => { const n = await saveFile("dns_records.ps1", withBom(toPowershell(sortedRecords(), dnsSettings.domain)), "text/plain", "ps1"); status(n ? TEXT.saved(n) : TEXT.cancelled); } }, TEXT.exportPs),
      el("button", { class: "btn", onclick: async () => { const recs = sortedRecords(); if (await copyText(toTsv(recs))) status(TEXT.tableCopied(recs.length)); } }, TEXT.copyTable)))];
  if (r.problems.length) kids.push(el("div", { class: "msg warn" }, el("h3", { text: TEXT.problems }), el("ul", {}, r.problems.map((p) => el("li", { text: p })))));
  const head = el("tr", {}, TABLE_COLUMNS.map((name, i) => el("th", {
    "aria-sort": dns.sort.col === i ? (dns.sort.dir > 0 ? "ascending" : "descending") : null,
    onclick: () => { dns.sort = { col: i, dir: dns.sort.col === i ? -dns.sort.dir : 1 }; renderDns(); },
  }, name)));
  const rows = sortedRecords().map((rec) => {
    const v = recordRow(rec);
    return el("tr", { class: rec.is_record ? "" : "norec" },
      el("td", { class: "fqdn", text: v[0] }), el("td", { text: v[1] }), el("td", { text: v[2] }), el("td", { text: v[3] }),
      el("td", { text: v[4] }), el("td", { text: v[5] }),
      el("td", {}, el("span", { class: "status " + (rec.warnings.length ? "warn" : "ok"), text: v[6] })));
  });
  kids.push(el("div", { class: "table-wrap" }, el("table", { class: "records" }, el("thead", {}, head), el("tbody", {}, rows))));
  w.replaceChildren(...kids);
  status(summaryText(r));
}
/* UI END ===================================================================== */

</script>
