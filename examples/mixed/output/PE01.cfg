interface TenGigE0/0/0/1.100
 description # CE01 - TwentyFiveGigE1/0/1.100 - ( underlay ) #
 vrf underlay
 ipv4 address 192.0.2.1 255.255.255.254
 encapsulation dot1q 100
!
interface TenGigE0/0/0/2.300
 description # CE01 - TwentyFiveGigE1/0/2.300 - ( GRT ) #
 ipv4 address 198.51.100.1 255.255.255.254
 encapsulation dot1q 300
!
router bgp 65100
 address-family ipv4 unicast
 !
 address-family vpnv4 unicast
 !
 neighbor 198.51.100.0
  remote-as 65001
  description CE01-(GRT)
  address-family ipv4 unicast
   route-policy RP-BGP65001InBgp65100-GRT in
   route-policy RP-BGP65100OutBgp65001-GRT out
  !
