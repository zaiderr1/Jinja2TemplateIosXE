vrf definition underlay
 rd 65100:100
 !
 address-family ipv4
 exit-address-family
!
interface GigabitEthernet0/0/1.100
 description # CE01 - TwentyFiveGigE1/0/1.100 - ( underlay ) #
 encapsulation dot1Q 100
 vrf forwarding underlay
 ip address 192.0.2.1 255.255.255.254
!
router bgp 65100
 !
 address-family ipv4 vrf underlay
  redistribute connected
  neighbor 192.0.2.0 remote-as 65001
  neighbor 192.0.2.0 description CE01-(vrf underlay)
  neighbor 192.0.2.0 activate
  neighbor 192.0.2.0 route-map RP-BGP65100OutBgp65001-underlay out
  neighbor 192.0.2.0 route-map RP-BGP65001InBgp65100-underlay in
 exit-address-family
!
end
